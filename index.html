<!doctype html><html lang="da"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/><meta name="theme-color" content="#101a32"/><meta name="apple-mobile-web-app-capable" content="yes"/><title>Crowd Commander</title><link rel="manifest" href="/manifest.webmanifest"/><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a32;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;pointer-events:none;text-shadow:0 2px 8px #0009;font-weight:800}#hud span{background:#101a32b9;border:1px solid #ffffff30;border-radius:14px;padding:9px 13px}#bar{position:fixed;top:72px;left:15%;width:70%;height:7px;background:#ffffff44;border-radius:20px;overflow:hidden}#fill{height:100%;background:linear-gradient(90deg,#45d8ff,#68ffbb);width:0%}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#071327b8;backdrop-filter:blur(6px);padding:24px;text-align:center}#panel{max-width:380px;width:100%;padding:26px 22px;background:linear-gradient(150deg,#223c68,#111c35);border:1px solid #ffffff35;border-radius:25px;box-shadow:0 25px 90px #0009}h1{font-size:32px;line-height:1.1;margin:0 0 15px}p{line-height:1.5;color:#d8e7ff}button{font-size:19px;font-weight:850;color:#102544;background:linear-gradient(135deg,#75f3ff,#8bffbd);border:0;border-radius:16px;padding:16px 24px;width:100%;margin-top:12px;box-shadow:0 8px 0 #2c8c94}#toast{position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#0e2037c9;padding:9px 18px;border-radius:12px;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}#hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;color:#e1edffb5;pointer-events:none}#mute{position:fixed;right:16px;bottom:calc(40px + env(safe-area-inset-bottom));border:1px solid #ffffff44;background:#172b48c9;color:white;border-radius:12px;padding:9px;width:auto;font-size:16px;box-shadow:none;z-index:3}</style></head><body><div id="hud"><span id="level">BANE 1/10</span><span id="troops">⚔️ 12</span></div><div id="bar"><div id="fill"></div></div><div id="toast"></div><div id="hint">Træk fingeren til siderne for at styre hæren</div><button id="mute" aria-label="Slå lyd til eller fra">🔊</button><div id="overlay"><div id="panel"><h1 id="heading">⚔️ Crowd Commander</h1><p id="message">10 håndlavede 3D-baner. Vælg porte, saml soldater, undgå fælder og besejr bosser. Ingen reklamer. Ingen basebygning.</p><button id="action">SPIL NU →</button></div></div><script type="module" src="/src/main.js"></script></body></html>
